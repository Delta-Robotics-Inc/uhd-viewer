# Type-check and build the viewer against UHD checked out beside it
# (vite.config.ts and tsconfig.json resolve @uhd/* to ../uhd/src).
# UHD is public, so no token is needed. It is checked out at the first branch
# it has of: this branch's name, the pull request's base branch, the
# STACK_BASE_BRANCH repository variable, main.
name: CI

on:
  pull_request:
  push:
    branches: ["mark/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a push and the pull request from the same branch share
# a group, so the later one cancels the earlier.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  viewer:
    name: Type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: uhd-viewer
      - name: Pick the UHD branch
        id: uhd
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          STACK_BASE_BRANCH: ${{ vars.STACK_BASE_BRANCH }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # The first candidate UHD has. git ls-remote --exit-code returns 2
          # for no such branch (bash -e: keep the status).
          for ref in "$BRANCH" "$BASE_REF" "$STACK_BASE_BRANCH" main; do
            if [ -z "$ref" ]; then continue; fi
            status=0
            git ls-remote --exit-code --heads https://github.com/Delta-Robotics-Inc/uhd.git "refs/heads/$ref" >/dev/null || status=$?
            case $status in
              0) echo "UHD at $ref"; echo "ref=$ref" >>"$GITHUB_OUTPUT"; exit 0 ;;
              2) echo "UHD has no branch $ref" ;;
              *) echo "::error::cannot list Delta-Robotics-Inc/uhd branches"; exit 1 ;;
            esac
          done
          echo "::error::UHD has none of the candidate branches"
          exit 1
      - uses: actions/checkout@v5
        with:
          repository: Delta-Robotics-Inc/uhd
          ref: ${{ steps.uhd.outputs.ref }}
          path: uhd
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uhd-viewer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: uhd-viewer
      - run: npm run type-check
        working-directory: uhd-viewer
      - run: npm run build
        working-directory: uhd-viewer

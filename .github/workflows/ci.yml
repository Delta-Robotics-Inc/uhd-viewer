# Type-check, test, build and pack the viewer against UHD checked out beside it
# (vite.config.ts and tsconfig.json resolve @uhd/* to ../uhd/src).
#
# UHD is the public repository Delta-Robotics-Inc/OpenUHD, checked out at a
# release tag (UHD_REF below; "Run workflow" takes another tag or commit). No
# secret and no private repository is used, so a pull request from a fork runs
# the same checks. Workflows on `pull_request` get a read-only token and no
# secrets for a fork's pull request; nothing here uses `pull_request_target`.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      uhd-ref:
        description: The Delta-Robotics-Inc/OpenUHD tag (or commit) to build against
        required: false
        default: ""

permissions:
  contents: read

# One run per branch: a later push cancels the run before it.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # The UHD release the viewer builds against. Move it with package.json's peerDependencies.
  UHD_REF: v0.3.0
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  viewer:
    name: Type-check, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.1
        with:
          path: uhd-viewer
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.1
        with:
          repository: Delta-Robotics-Inc/OpenUHD
          ref: ${{ inputs.uhd-ref || env.UHD_REF }}
          path: uhd
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uhd-viewer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: uhd-viewer
      - run: npm run type-check
        working-directory: uhd-viewer
      - run: npm test
        working-directory: uhd-viewer
      - run: npm run build
        working-directory: uhd-viewer
      - name: The package can be published from this repository
        working-directory: uhd-viewer
        run: node .github/scripts/release.mjs version && node .github/scripts/release.mjs package --repository Delta-Robotics-Inc/uhd-viewer
      - name: What the npm package would carry
        working-directory: uhd-viewer
        # prepack builds again; the build above already failed if it would
        run: npm pack --dry-run --ignore-scripts
